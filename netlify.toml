# Configuración de despliegue en Netlify (ver docs/deploy-netlify.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta desconocida sirve index.html (el router del cliente decide).
# (También está public/_redirects para que funcione en drag-and-drop.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y su registro NO deben cachearse: así las actualizaciones llegan.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

# El shell HTML siempre se revalida → apunta a los assets con hash más recientes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Los assets llevan hash en el nombre → cache inmutable de larga duración.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
