# Configuración de despliegue en Netlify (ver docs/deploy-netlify.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta desconocida sirve index.html (el router del cliente decide).
# (También está public/_redirects para que funcione en drag-and-drop.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y su registro NO deben cachearse: así las actualizaciones llegan.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

# El shell HTML siempre se revalida → apunta a los assets con hash más recientes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Los assets llevan hash en el nombre → cache inmutable de larga duración.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad globales (auditoría 2026-07-01).
# La CSP va en modo Report-Only para no romper nada sin probar en vivo: revisa la
# consola del navegador; cuando no haya violaciones, renombra el encabezado a
# "Content-Security-Policy" para hacerla cumplir. Ajusta *.supabase.co a tu proyecto.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
